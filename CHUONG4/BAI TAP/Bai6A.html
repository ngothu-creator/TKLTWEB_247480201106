<html>
    <title>Tính tuổi</title>
<body>
    <script language="JavaScript">
        var D = new Date();
        var Namsinh, NamHienTai;

        NamHienTai = D.getFullYear();
        Namsinh = prompt("Bạn sinh năm bao nhiêu ?:", "");
        alert("Tuổi của bạ bây giờ là : " + (NamHienTai - Namsinh));
    </script>
</body>
</html>
