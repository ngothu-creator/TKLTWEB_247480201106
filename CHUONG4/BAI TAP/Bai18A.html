<html>
<head>
    <title>Đếm số ký tự</title>
    <script>
        function KiemTra()
        {
            var NoiDung = document.getElementById("NoiDung");
            var SoKyTu = document.getElementById("SoKyTu");
            SoKyTu.value = NoiDung.value.length;
            if (NoiDung.value.length > 200) 
            {
            alert("Bạn đã gõ quá số ký tự cho phép!");
            }
        }
    </script>
</head>
<body style="font-family:arial">

    Số ký tự đã gõ: <input type="text" id="SoKyTu" readonly> 

    <br><br>

    <textarea id="NoiDung"
          cols="50"
          rows="10"
          onkeyup="KiemTra()">
    </textarea>

</body>
</html>
