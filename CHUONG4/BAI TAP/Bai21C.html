<html>
<head>
    <title>Tính toán</title>
    <meta charset=utf-8>
</head>

<body>

    <h2>Chương trình tính toán</h2>

    Số 01:
    <input type="text" id="So01">

    <br><br>

    Số 02:
    <input type="text" id="So02">

    <br><br>

    Kết quả:
    <input type="text" id="Ketqua">

    <br><br>

    Phép tính:

    <select id="PhepTinh">
        <option value="cong">Cộng</option>
        <option value="tru">Trừ</option>
        <option value="nhan">Nhân</option>
        <option value="chia">Chia</option>
    </select>

    <input type="button" value="Tính"
       onclick="Tinh()">

    <script>
        function Tinh()
        {
            var a = parseFloat(document.getElecmentById("So01").value);
            var b = parseFloat(document.getElecmentById("So02").value);

            if (isNaN(a) || isNaN(b))
            {
                alert("Vui lòng nhập hai số!");
                return;
            }

            var phepTinh = document.getElementById("PhepTinh").value;

            var Ketqua;

            if (phepTinh == "cong")
                Ketqua = a + b;

            else if (phepTinh == "tru")
                Ketqua = a - b;

            else if (phepTinh == "nhan")
                Ketqua = a * b;

            else if (phepTinh == "chia")
            {
                if (b == 0)
                {
                    alert("Không thể chia cho 0!");
                    return;
                }

                Ketqua = a / b;
            }
            document.getElementById("Ketqua").value = Ketqua;
        }
    </script>
</body>
</html>
