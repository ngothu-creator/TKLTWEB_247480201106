<html>
<head>
    <title>Xu ly su kien</title>
    <meta charset="utf-8">
    <script>
        function HienThi(noiDung)
        {
            document.getElementById("ThongBao").innerHTML = noiDung;
        }
    </script>
</head>
<body>

    <input type="button"
       value="Gửi"
       onmousemove="HienThi('Chuột trên nút gửi');">

    <br><br>

    <input type="text"
       value=""
       onmousemove="HienThi('Chuột trên ô nhập');">

    <br><br>

    <input type="radio"
       name="GioiTinh"
       onmousemove="HienThi('Chuột trên nam');">
    Nam

    <input type="radio"
       name="GioiTinh"
       onmousemove="HienThi('Chuột trên nữ');">
    Nữ

    <br><br>

    <div id="ThongBao"></div>

</body>
</html>
