<html>
<head>
    <title>Đổi màu nền</title>
</head>
<body>

    <script language="javascript">
    function doiMau()
    {
        document.bgColor = Mau.value;
    }
    </script>

    Bạn hãy chọn màu nền:

    <br><br>

    <input type="radio" name="Mau" value="yellow"
    onclick="doiMau();"> Màu vàng

    <input type="radio" name="Mau" value="green"
    onclick="doiMau();"> Màu xanh lá

    <input type="radio" name="Mau" value="brown"
    onclick="doiMau();"> Màu nâu

    <input type="radio" name="Mau" value="magenta"
    onclick="doiMau();"> Màu hồng

</body>
</html>
