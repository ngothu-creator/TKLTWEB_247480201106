<html>

<head>
    <meta http-equiv="Content-Type"
          content="text/html; charset=utf-8">

    <title>Đăng ký thể thao</title>
</head>

<body>

<table border="1" width="850" align="center"
       cellpadding="8" cellspacing="0">

    <tr>
        <td colspan="2">

            <font face="Arial" size="3">
                <b>Đăng ký thể thao</b>
            </font>

        </td>
    </tr>

    <tr>
        <td colspan="2">

            <table width="100%">

                <tr>

                    <!-- LOGO -->
                    <td width="20%" align="center">

                        <img src="logo.jpg"
                             width="130"
                             height="90">

                    </td>

                    <td width="40%" align="left">

                        <font face="Arial" size="3">

                            <b>TRƯỜNG ĐẠI HỌC BẠC LIÊU</b>
                            <br>

                            KHOA KỸ THUẬT VÀ CÔNG NGHỆ

                        </font>

                    </td>

                    <td width="40%" align="center">

                        <font face="Arial" size="3">

                            <b>
                                CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM
                            </b>

                            <br>

                            Độc lập - Tự do - Hạnh phúc

                        </font>

                    </td>

                </tr>

            </table>

            <center>

                <font face="Verdana" size="5" color="red">
                    <b>PHIẾU ĐĂNG KÝ DỰ THI THỂ THAO</b>
                </font>

            </center>

            <br>

            <form>

                <table width="100%">

                    <tr>

                        <td width="55%" valign="top">

                            <font face="Arial" size="2">

                                Họ tên:

                                <input type="text"
                                       name="username"
                                       size="25">

                                <br><br>

                                Mật khẩu:

                                <input type="password"
                                       name="password"
                                       size="25">

                            </font>

                        </td>

                        <td width="45%" valign="top">

                            <font face="Arial" size="2">

                                <b>Môn thể thao:</b>

                                <br>
                                <input type="checkbox"
                                       name="BongDa"
                                       value="1">

                                Bóng đá

                                <br>

                                <input type="checkbox"
                                       name="BongChuyen"
                                       value="2">

                                Bóng chuyền

                                <br>

                                <input type="checkbox"
                                        name="DienKinh"
                                        value="3">

                                Điền kinh 
                                <br>

                                <input type="checkbox"
                                       name="Boi"
                                       value="4">

                                Bơi lội

                            </font>

                        </td>

                    </tr>

                </table>

            </form>

        </td>
    </tr>

    <tr>

        <td colspan="2" align="center">

            <font face="Verdana" size="3">
                <b>PHẦN CỨNG MÁY TÍNH</b>
            </font>

        </td>

    </tr>

    <tr>

        <td width="50%" valign="top">

            <font face="Arial" size="2">

                <b>Thiết bị:</b>

            </font>

                <br><br>

                <select name="thietbi" size="4">
                        style="width: 230px; border: 2px solid black;">
                    <option value="CPU">
                        CPU
                    </option>

                    <option value="Mainboard">
                        Mainboard
                    </option>

                    <option value="ASUSDVD">
                        ASUS DVD
                    </option>

                    <option value="RAMKingMax">
                        RAM KingMax
                    </option>

                </select>

        </td>

        <td width="50%" valign="top">

            <font face="Arial" size="2">

                <b>Thời gian bảo hành:</b>

                <select name="baohanh">

                    <option value="1nam">
                        1 năm
                    </option>

                    <option value="2nam">
                        2 năm
                    </option>

                    <option value="3nam">
                        3 năm
                    </option>

                </select>

                <br><br>

                <input type="submit"
                       name="submit"
                       value="Submit">

                &nbsp;&nbsp;&nbsp;

                <input type="reset"
                       value="Reset">

            </font>

        </td>

    </tr>

</table>

</body>

</html>
