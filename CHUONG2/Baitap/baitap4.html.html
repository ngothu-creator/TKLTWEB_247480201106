<html>

<head>
    <meta http-equiv="Content-Type"
          content="text/html; charset=utf-8">

    <title>Đăng ký dự thi</title>
</head>

<body>

<table border="1" width="800" height="600"
       align="center" cellpadding="10">

    <!-- TIÊU ĐỀ KHUNG -->
    <tr>
        <td height="30">

            <font face="Arial" size="3">
                <b>Đăng ký dự thi</b>
            </font>

        </td>
    </tr>

    <tr>
        <td>

            <table width="100%">

                <tr>

                    <td width="50%" align="left">

                        <font face="Verdana" size="3">

                            <b>TRƯỜNG ĐẠI HỌC BẠC LIÊU</b>
                            <br>

                            KHOA KỸ THUẬT VÀ CÔNG NGHỆ

                        </font>

                    </td>

                    <td width="50%" align="center">

                        <font face="Verdana" size="3">

                            <b>
                                CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM
                            </b>

                            <br>

                            Độc lập - Tự do - Hạnh phúc

                        </font>

                    </td>

                </tr>

            </table>

            <center>

                <font face="Verdana" size="5" color="red">
                    <b>ĐĂNG KÝ XÉT TUYỂN</b>
                </font>

            </center>

            <br><br>

            <form>

                <table width="600" align="center">

                    <!-- HỌ TÊN -->
                    <tr>

                        <td width="150">
                            <font face="Arial" size="2">
                                Họ tên :
                            </font>
                        </td>

                        <td>
                            <input type="text"
                                   name="hoten"
                                   size="30">
                        </td>

                    </tr>

                    <tr>

                        <td>
                            <font face="Arial" size="2">
                                Giới tính:
                            </font>
                        </td>

                        <td>

                            <input type="radio"
                                   name="gioitinh"
                                   value="Nam"
                                   checked>

                            <font face="Arial" size="2">
                                Nam
                            </font>

                            &nbsp;&nbsp;&nbsp;

                            <input type="radio"
                                   name="gioitinh"
                                   value="Nu">

                            <font face="Arial" size="2">
                                Nữ
                            </font>

                        </td>

                    </tr>

                    <tr>

                        <td valign="top">

                            <font face="Arial" size="2">
                                Ngành thi:
                            </font>

                        </td>

                        <td>

                            <input type="radio"
                                   name="nganh"
                                   value="CNTT"
                                   checked>

                            <font face="Arial" size="2">
                                Công nghệ thông tin
                            </font>

                            <br>

                            <input type="radio"
                                   name="nganh"
                                   value="MamNon">

                            <font face="Arial" size="2">
                                Mầm non
                            </font>

                            <br>

                            <input type="radio"
                                   name="nganh"
                                   value="AmNhac">

                            <font face="Arial" size="2">
                                Âm nhạc
                            </font>

                        </td>

                    </tr>

                    <tr>
                        <td colspan="2">
                            <br>
                        </td>
                    </tr>

                    <tr>

                        <td valign="top">

                            <font face="Arial" size="2">
                                Sở thích:
                            </font>

                        </td>

                        <td>

                            <input type="checkbox"
                                   name="Books"
                                   value="1">

                            <font face="Arial" size="2">
                                Đọc sách
                            </font>

                            <br>

                            <input type="checkbox"
                                   name="Music"
                                   value="2">

                            <font face="Arial" size="2">
                                Nghe nhạc
                            </font>

                            <br>

                            <input type="checkbox"
                                   name="Movies"
                                   value="3">

                            <font face="Arial" size="2">
                                Xem phim
                            </font>

                            <br>
                            <input type="checkbox"
                                   name="Cooking"
                                   value="4">

                            <font face="Arial" size="2">
                                Nấu ăn
                            </font>

                        </td>

                    </tr>

                    <tr>

                        <td valign="top">

                            <font face="Arial" size="2">
                                Học lực:
                            </font>

                        </td>

                        <td>

                            <select name="hocluc" size="1">

                                <option value="invalid">
                                    Chọn mức học lực
                                </option>

                                <option value="HSchool">
                                    Trung Học
                                </option>

                                <option value="College">
                                    Cao Đẳng
                                </option>

                                <option value="University">
                                    Đại Học
                                </option>

                            </select>

                        </td>

                    </tr>

                    <tr>
                        <td colspan="2">
                            <br><br>
                        </td>
                    </tr>

                    <tr>

                        <td></td>

                        <td>

                            <input type="submit"
                                   name="submit"
                                   value="Đồng ý">

                            &nbsp;&nbsp;&nbsp;&nbsp;

                            <input type="reset"
                                   value="Không đồng ý">

                        </td>

                    </tr>

                </table>

            </form>

        </td>
    </tr>

</table>

</body>

</html>
